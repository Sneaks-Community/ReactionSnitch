services:
  reactionsnitch:
    image: ghcr.io/sneaks-community/reactionsnitch:latest
    container_name: reactionsnitch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "if (process.uptime() < 10) process.exit(1); process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
