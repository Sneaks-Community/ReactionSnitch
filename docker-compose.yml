services:
  reactionsnitch:
    image: ghcr.io/sneaks-community/reactionsnitch:latest
    container_name: reactionsnitch
    restart: unless-stopped
    read_only: true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
