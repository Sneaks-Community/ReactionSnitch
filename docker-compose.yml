services:
  reactionsnitch:
    image: ghcr.io/sneaks-community/reactionsnitch:latest
    container_name: reactionsnitch
    restart: unless-stopped
    read_only: true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
